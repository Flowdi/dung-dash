<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dung Dash</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="start-screen">
      <h1 class="main-title">Dung Dash</h1>
      <p class="instructions">
        Der Kothaufen muss zur Toilette gebracht werden!<br>
        Sammle auf dem Weg so viele Fliegen wie möglich ein
      </p>
      <p class="instructions">
        Mit den Pfeiltasten bewegen.
      </p>
      <p class="instructions">Mit der Leertaste springen.</p>

      <div class="btn-container">
        <button class="btn" id="start-btn">Start</button>
      </div>
    </div>
    <!-- Score-Bereich -->
    <div class="score">
      <p>Fliegen eingesammelt: <span id="flies-collected">0</span>/<span id="total-flies">20</span></p>
    </div>
    <!-- Checkpoint-Bereich -->
    <div class="checkpoint-screen">
      <h2>Gratuliere</h2>
      <p>Dein Kothaufen hat die Toilette erreicht!</p>
    </div>

    <canvas id="canvas"></canvas>

    <script src="./script.js"></script>
  </body>
</html>
